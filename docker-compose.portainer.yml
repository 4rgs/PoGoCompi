version: '3.8'

# 🚀 Pokémon GO Comparador - Optimizado para Portainer GUI
# 🐋 Incluye Watchtower para auto-actualización
# � Solo requiere GUI de Portainer - Sin configuración previa del host

services:
  # Aplicación principal
  pogocompi:
    image: ghcr.io/4rgs/pogocompi:latest
    container_name: pogocompi-app
    hostname: pogocompi
    restart: unless-stopped
    ports:
      - "3001:80"    # Puerto principal de la aplicación
    environment:
      - TZ=America/Santiago
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
    volumes:
      # Logs persistentes (Docker managed volumes)
      - pogocompi-logs:/var/log/nginx
    networks:
      - pogocompi-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      # Watchtower auto-update
      - "com.centurylinklabs.watchtower.enable=true"
      
      # Portainer access control
      - "io.portainer.accesscontrol.teams=administrators"
      - "io.portainer.accesscontrol.users=admin"
      
      # App metadata
      - "app.name=Pokémon GO DPS Comparator"
      - "app.description=Analiza y compara el DPS de Pokémon GO"
      - "app.version=latest"
      - "app.url=http://zimaboard.local:3001"
      - "app.icon=🔍"
      - "app.category=gaming"
      - "maintainer=4rgs"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Auto-actualizador Watchtower
  watchtower:
    image: containrrr/watchtower:latest
    container_name: pogocompi-watchtower
    hostname: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=America/Santiago
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_ROLLING_RESTART=true
      - WATCHTOWER_TIMEOUT=30s
      - WATCHTOWER_LOG_LEVEL=info
    command: >
      --schedule "0 2 * * *"
      --cleanup
      --label-enable
      --rolling-restart
      --log-level info
      --interval 3600
    networks:
      - pogocompi-network
    labels:
      # Portainer access control
      - "io.portainer.accesscontrol.teams=administrators"
      - "io.portainer.accesscontrol.users=admin"
      
      # App metadata
      - "app.name=Watchtower Auto-updater"
      - "app.description=Actualiza automáticamente PoGoCompi"
      - "app.version=latest"
      - "maintainer=containrrr"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M

volumes:
  # Logs persistentes - Docker managed volume
  pogocompi-logs:
    driver: local
    labels:
      - "app.name=PoGoCompi Logs"
      - "app.description=Logs persistentes de Nginx"

networks:
  # Red interna para los servicios
  pogocompi-network:
    driver: bridge
    name: pogocompi-net
    labels:
      - "app.name=PoGoCompi Network"
      - "app.description=Red interna para PoGoCompi"

# Stack Labels para Portainer
x-portainer-labels:
  stack.name: "pogocompi"
  stack.description: "Pokémon GO DPS Comparator con auto-actualización"
  stack.version: "2.1"
  stack.maintainer: "4rgs"
  stack.url: "https://github.com/4rgs/PoGoCompi"
  stack.icon: "🔍"
  stack.category: "Entertainment"
  stack.environment: "Production"

name: Deploy to Google Cloud Run

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

env:
  PROJECT_ID: pogocompi
  SERVICE_NAME: pogo-compi
  REGION: us-central1
  GAR_LOCATION: us-central1
  REPOSITORY: pogo-compi-repo

jobs:
  # Job para PRs - solo build y test (sin deploy)
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests (if you have any)
      run: |
        # npm run test
        echo "No tests configured yet"

    - name: Build application
      run: npm run build

    - name: Build Docker image (test)
      run: docker build -t test-image .

  # Job para deploy - solo en push a develop o workflow_dispatch
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    # Debug - verificar que los secrets están disponibles
    - name: Debug secrets availability
      run: |
        if [ -z "${{ secrets.WIF_PROVIDER }}" ]; then
          echo "❌ WIF_PROVIDER secret no está configurado"
          echo "Ve a: https://github.com/4rgs/PoGoCompi/settings/secrets/actions"
          echo "Agrega: WIF_PROVIDER con valor: projects/1073541854485/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          exit 1
        else
          echo "✅ WIF_PROVIDER secret está configurado"
        fi
        if [ -z "${{ secrets.WIF_SERVICE_ACCOUNT }}" ]; then
          echo "❌ WIF_SERVICE_ACCOUNT secret no está configurado"
          echo "Ve a: https://github.com/4rgs/PoGoCompi/settings/secrets/actions"
          echo "Agrega: WIF_SERVICE_ACCOUNT con valor: github-actions@pogocompi.iam.gserviceaccount.com"
          exit 1
        else
          echo "✅ WIF_SERVICE_ACCOUNT secret está configurado"
        fi

    - name: Google Auth
      id: auth
      uses: 'google-github-actions/auth@v2'
      with:
        workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
        service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

    - name: Set up Cloud SDK
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Configure Docker to use gcloud as credential helper
      run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

    # Crear repositorio en Artifact Registry si no existe
    - name: Create Artifact Registry repository (if needed)
      run: |
        gcloud artifacts repositories create ${{ env.REPOSITORY }} \
          --repository-format=docker \
          --location=${{ env.GAR_LOCATION }} \
          --description="Docker repository for ${{ env.SERVICE_NAME }}" \
          --project=${{ env.PROJECT_ID }} || echo "Repository already exists"

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Build Docker image
      run: |
        docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
                     -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest .

    - name: Push Docker image to Artifact Registry
      run: |
        docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
          --platform managed \
          --region ${{ env.REGION }} \
          --allow-unauthenticated \
          --port 8080 \
          --memory 512Mi \
          --cpu 1 \
          --min-instances 0 \
          --max-instances 10 \
          --project ${{ env.PROJECT_ID }} \
          --quiet

    - name: Get service URL
      run: |
        echo "🌐 Aplicación desplegada en:"
        gcloud run services describe ${{ env.SERVICE_NAME }} \
          --platform managed \
          --region ${{ env.REGION }} \
          --format 'value(status.url)' \
          --project ${{ env.PROJECT_ID }}

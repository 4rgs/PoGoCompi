# Configuración para Cloud Run
# Este archivo define la configuración del servicio para Google Cloud Run

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: pogo-compi
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
spec:
  template:
    metadata:
      annotations:
        # Configuración de autoscaling
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        # Configuración de recursos
        run.googleapis.com/memory: "512Mi"
        run.googleapis.com/cpu: "1"
        # Configuración de timeout
        run.googleapis.com/timeout: "300"
    spec:
      containerConcurrency: 80
      containers:
      - image: gcr.io/PROJECT_ID/pogo-compi:latest
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
  traffic:
  - percent: 100
    latestRevision: true

version: '3.8'

services:
  pogocompi:
    image: ghcr.io/4rgs/pogocompi:latest
    container_name: pogocompi-app
    restart: unless-stopped
    ports:
      - "3001:8080"
    environment:
      - TZ=America/Mexico_City
    networks:
      - pogocompi-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "casaos.name=Pokémon GO Comparador"
      - "casaos.title=PokéDPS - Comparador de DPS"
      - "casaos.description=Analiza y compara el DPS de tus Pokémon favoritos"
      - "casaos.icon=https://raw.githubusercontent.com/4rgs/PoGoCompi/develop/public/icons/icon-192x192.png"
      - "casaos.category=Games"
      - "casaos.port=3001"
      - "casaos.scheme=http"
      - "casaos.hostname="
      - "casaos.tips.pwa=Instala como PWA desde tu navegador para mejor experiencia"
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: pogocompi-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=America/Mexico_City
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INCLUDE_STOPPED=true
    networks:
      - pogocompi-network
    labels:
      - "casaos.name=Auto-actualizador"
      - "casaos.category=Utilities"
      - "casaos.description=Mantiene PoGoCompi actualizado automáticamente"

networks:
  pogocompi-network:
    driver: bridge
    name: pogocompi-network

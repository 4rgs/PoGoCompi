version: '3.8'

services:
  pogocompi:
    image: ghcr.io/4rgs/pogocompi:latest
    container_name: pogocompi-app
    restart: unless-stopped
    ports:
      - "3001:80"  # Puerto externo 3001 para evitar conflictos con CasaOS
    environment:
      - TZ=America/Mexico_City  # Ajusta según tu zona horaria
    networks:
      - pogocompi-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      # Etiquetas para CasaOS
      - "casaos.name=Pokémon GO Comparador"
      - "casaos.title=Comparador de Pokémon GO - DPS Analyzer"
      - "casaos.description=Analiza y compara el DPS de tus Pokémon favoritos con precisión profesional"
      - "casaos.icon=https://raw.githubusercontent.com/4rgs/PoGoCompi/develop/public/icons/icon-512x512.png"
      - "casaos.category=Entertainment"
      - "casaos.port=3001"
      - "casaos.scheme=http"
      - "casaos.hostname="
      # Etiquetas para Traefik (si usas reverse proxy)
      - "traefik.enable=true"
      - "traefik.http.routers.pogocompi.rule=Host(`pogocompi.local`)"
      - "traefik.http.services.pogocompi.loadbalancer.server.port=80"
      # Etiquetas para Watchtower
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: pogocompi-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=America/Mexico_City  # Ajusta según tu zona horaria
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_POLL_INTERVAL=1800  # 30 minutos
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
      - WATCHTOWER_NOTIFICATION_URL=  # Opcional: agregar webhook para notificaciones
    command: --schedule "0 */6 * * *" --cleanup --label-enable  # Cada 6 horas
    networks:
      - pogocompi-network
    labels:
      - "casaos.name=Pokémon GO - Auto Updater"
      - "casaos.title=Auto-actualizador para Pokémon GO Comparador"
      - "casaos.description=Mantiene automáticamente actualizada la aplicación"
      - "casaos.category=Utilities"

networks:
  pogocompi-network:
    driver: bridge
    name: pogocompi-net
    labels:
      - "casaos.name=Pokémon GO Network"

# Configuración adicional para CasaOS
x-casaos:
  name: "Pokémon GO Comparador"
  title: "Comparador de Pokémon GO - DPS Analyzer"
  description: "Analiza y compara el DPS de tus Pokémon favoritos con precisión profesional. PWA con funcionalidad offline."
  category: "Entertainment"
  icon: "https://raw.githubusercontent.com/4rgs/PoGoCompi/develop/public/icons/icon-512x512.png"
  screenshot: "https://raw.githubusercontent.com/4rgs/PoGoCompi/develop/public/screenshots/desktop.png"
  thumbnail: "https://raw.githubusercontent.com/4rgs/PoGoCompi/develop/public/icons/icon-192x192.png"
  tagline: "🔍 Analiza DPS • 📊 Compara Pokémon • 📱 PWA Offline"
  tips: |
    ## Consejos de uso:
    - 📱 Instala como PWA para mejor experiencia
    - 🔄 Los datos se actualizan automáticamente
    - 📊 Compara hasta múltiples Pokémon
    - 💾 Funciona offline una vez cacheado
  changelog: |
    ## Últimas actualizaciones:
    - ✨ Interfaz mejorada
    - 🚀 Mejor rendimiento
    - 📱 PWA optimizada
    - 🔄 Auto-actualización
  author: "4rgs"
  website: "https://github.com/4rgs/PoGoCompi"
  healthy_check_url: "http://localhost:3001/health"
  architectures:
    - amd64
    - arm64

version: '3.8'

# 🚀 Pokémon GO Comparador - CasaOS Optimizado
# 📱 Aplicación PWA para analizar y comparar DPS de Pokémon

services:
  pogocompi:
    image: ghcr.io/4rgs/pogocompi:latest
    container_name: pogocompi-app
    hostname: pogocompi
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - TZ=${TZ:-America/Santiago}
      - PUID=1000
      - PGID=1000
    networks:
      - casa-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      # CasaOS Integration
      - "casaos.name=Pokémon GO Comparador"
      - "casaos.title=Comparador de Pokémon GO - DPS Analyzer"
      - "casaos.description=Analiza y compara el DPS de tus Pokémon favoritos con precisión profesional. PWA con funcionalidad offline."
      - "casaos.icon=https://raw.githubusercontent.com/4rgs/PoGoCompi/develop/public/icons/icon-512x512.png"
      - "casaos.category=Entertainment"
      - "casaos.port=80"
      - "casaos.scheme=http"
      - "casaos.index=/"
      # Traefik Labels (si usas reverse proxy)
      - "traefik.enable=true"
      - "traefik.http.routers.pogocompi.rule=Host(`pogocompi.${DOMAIN:-local}`)"
      - "traefik.http.services.pogocompi.loadbalancer.server.port=80"
      # Watchtower
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  casa-network:
    external: true
    name: casa-network

# Metadatos para CasaOS App Store
x-casaos:
  architectures:
    - amd64
    - arm64
  main: pogocompi
  description:
    en_us: "Professional Pokémon GO DPS analyzer and comparator. PWA with offline functionality."
    es_es: "Analizador y comparador profesional de DPS para Pokémon GO. PWA con funcionalidad offline."
  tagline:
    en_us: "🔍 Analyze DPS • 📊 Compare Pokémon • 📱 PWA Offline"
    es_es: "🔍 Analiza DPS • 📊 Compara Pokémon • 📱 PWA Offline"
  developer: "4rgs"
  author: "4rgs"
  icon: "https://raw.githubusercontent.com/4rgs/PoGoCompi/develop/public/icons/icon-512x512.png"
  screenshot_link:
    - "https://raw.githubusercontent.com/4rgs/PoGoCompi/develop/public/screenshots/desktop.png"
    - "https://raw.githubusercontent.com/4rgs/PoGoCompi/develop/public/screenshots/mobile.png"
  thumbnail: "https://raw.githubusercontent.com/4rgs/PoGoCompi/develop/public/icons/icon-192x192.png"
  title:
    en_us: "Pokémon GO DPS Comparator"
    es_es: "Comparador DPS Pokémon GO"
  category: Entertainment
  port_map: "80"
  scheme: http
  index: /
  tips:
    before_install:
      en_us: |
        ## Before Installation:
        - Make sure port 80 is available
        - Application will be accessible at http://your-zima-ip:80
        - PWA can be installed directly from browser
        
      es_es: |
        ## Antes de la instalación:
        - Asegúrate que el puerto 80 esté disponible
        - La aplicación será accesible en http://ip-de-tu-zima:80
        - La PWA se puede instalar directamente desde el navegador
        
    after_install:
      en_us: |
        ## After Installation:
        - Access at http://your-zima-ip:80
        - Install as PWA for better experience
        - Data updates automatically
        - Works offline once cached
        
      es_es: |
        ## Después de la instalación:
        - Accede en http://ip-de-tu-zima:80
        - Instala como PWA para mejor experiencia
        - Los datos se actualizan automáticamente
        - Funciona offline una vez cacheado
